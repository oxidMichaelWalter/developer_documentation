services:
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./docs:/app
      - /app/node_modules
    command: npm start
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - docs-network

  docs-build:
    build:
      context: ./docs
      dockerfile: Dockerfile
    volumes:
      - ./docs:/app
      - /app/node_modules
    command: npm run build
    profiles:
      - build
    networks:
      - docs-network

  # Production nginx server
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docs/build:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - production
    depends_on:
      - docs-build
    networks:
      - docs-network

networks:
  docs-network:
    driver: bridge

volumes:
  node_modules: